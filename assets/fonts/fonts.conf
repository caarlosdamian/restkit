<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The card renderer's font set.

  Vercel's Linux runtime ships NO fonts at all, so librsvg resolved every
  family in the strip SVG — Geist, Helvetica, even the generic `sans-serif` —
  to nothing and drew .notdef boxes. The stamps still rendered (they are
  paths), which is why the card looked right and every word on it was tofu.

  `prefix="relative"` resolves against this file's own directory, so the same
  config works from a checkout and from /var/task without anyone injecting an
  absolute path.
-->
<fontconfig>
  <dir prefix="relative">.</dir>

  <!-- The function filesystem is read-only apart from /tmp. Without a
       writable cachedir fontconfig warns on every single render. -->
  <cachedir>/tmp/.fontconfig</cachedir>

  <!-- The SVG asks for Geist first, but it ends its stack at `sans-serif`.
       Point the generics here too, so a family we forgot to vendor lands on a
       real typeface instead of back on tofu. -->
  <alias><family>sans-serif</family><prefer><family>Geist</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Geist</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Geist</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Geist</family></prefer></alias>
</fontconfig>
